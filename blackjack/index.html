<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Blackjack</title>
</head>
<body>
<header>
    <h1>BLACKJACK</h1>
</header>
<div class="center">
    <div class="game">
        <h2>Osztó</h2>
        <p id="dealerHand">Kártyák: -</p>
        <h2>Játékos</h2>
        <p id="playerHand">Kártyák: -</p>
        <div class="controls">
            <button id="gameHit">Hit</button>
            <button id="gameStand">Stand</button>
        </div>
    </div>
    <div class="beforeGame">
        <button id="startGame">Start</button>
        <button id="feltoltesBtn">Feltöltés</button>
        <button id="tetButton">Tét megadása</button>
        <p id="egyenleg"></p>
        <p id="tet"></p>
    </div>
</div>
<footer>
    <p>semmi energiam szepiteni ezen az oldalon😭</p>
    <p>asd &copy</p>
</footer>
<script src="script.js"></script>
</body>
</html>
