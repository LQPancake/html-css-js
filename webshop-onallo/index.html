<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Webshop</title>
</head>
<body>
    <header>
        <h1>Krémshop</h1>
    </header>
    <h1>Termékek</h1>
    <section id="termekMezo">
        <img src="pics/majkrem.png" alt="Gyulai májkrém" title="Gyulai májkrém">
        <img src="pics/sajtkrem.png" alt="Natúr sajtkrém" title="Natúr sajtkrém">
        <img src="pics/vajkrem.png" alt="Mizo vajkrém" title="Mizo vajkrém">
        <img src="pics/nutella.webp" alt="Nutella" title="Nutella">
        <img src="pics/pisztaciakrem.webp" alt="Pisztáciakrém" title="Pisztáciakrém">
    </section>
    <section id="bevitelMezo">
        <input type="text" placeholder="Termék neve">
        <input type="number" placeholder="Termék ára">
        <label>
            <input type="checkbox">
            Van készleten?
        </label>
        <button type="submit">Termék hozzáadása</button>
    </section>
    <footer>
        <p>Minden jog fenntartva. &copy;</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
