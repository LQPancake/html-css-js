<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Steam Card Shop</title>
</head>
<body>
    <header>
        <div id="headerlogo"><img src="header_logo.png" alt="Steam Header" id="logo"></div>
    </header>
    <section>
        <div class="container" id="cards">
        </div>
    </section>
    <footer>
        <form id="create-product">
            <input type="number" name="price" placeholder="A termék ára" required>
            <button type="submit">Termék hozzáadása</button>
        </form>
    </footer>
    <script src="script.js"></script>
</body>
</html>
