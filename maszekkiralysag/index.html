<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Munkatársaink</h1>   
    <div class="container" id="workers">
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <div class="row" id="worker-list-component">  
      </div>
      <h3>Új dolgozó létrehozása:</h3>
      <div class="row">
        <form id="create-worker" class="p-5">
          <label class="w-25">
            Kép
            <input class="form-control" type="text" name="picture" id="picture">
          </label>
            <label class="w-25">
              Város
              <input class="form-control" type="text" name="city" id="city">
            </label>
            <label class="w-25">
              Név:
              <input class="form-control" type="text" name="name" id="name">
            </label>
            <label class="w-25">
              E-mail:
              <input class="form-control" type="text" name="email" id="email">
            </label>
            <button class="btn btn-primary" type="submit">Küldés</button>
        </form>
      </div>
      <div class="row">
        <div id="edit-worker">
        </div>
      </div>

    <script src="script.js"></script>  
</body>
</html>
